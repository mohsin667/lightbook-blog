services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lightbook_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lightbook_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lightbook
    volumes:
      - lightbook_pgdata:/var/lib/postgresql/data
    networks:
      - lightbook
    # No host port published — only reachable from other containers on the
    # "lightbook" network, unlike local dev's 5433:5432.

  backend:
    image: ghcr.io/mohsin667/lightbook-blog-backend:latest
    container_name: lightbook_backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - postgres
    networks:
      - lightbook

  frontend:
    image: ghcr.io/mohsin667/lightbook-blog-frontend:latest
    container_name: lightbook_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mounted from the host (not baked into the image) so switching from
      # nginx.conf to nginx.ssl.conf after the first cert is just a config
      # swap + `docker compose restart frontend` — no rebuild needed.
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - lightbook

  certbot:
    image: certbot/certbot
    container_name: lightbook_certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    # Idle by default — see deploy notes for the one-off "certonly" run that
    # issues the first cert, and the renew loop below (commented out) once
    # nginx.ssl.conf is live.
    #
    # This must be `command`, not `entrypoint`: `entrypoint` replaces the
    # image's real entrypoint (the certbot binary itself) unconditionally,
    # so `docker compose run --rm certbot certonly ...` would just pass
    # "certonly ..." as unused arguments to this idle shell loop instead of
    # ever invoking certbot. `command` is the default CMD, which `run`
    # properly overrides while leaving the image's own entrypoint intact.
    command: sh -c "trap exit TERM; while :; do sleep 12h; done"

networks:
  lightbook:

volumes:
  lightbook_pgdata:
  certbot-etc:
  certbot-webroot:
