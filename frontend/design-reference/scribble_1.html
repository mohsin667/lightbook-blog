<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lightbook.info — a blog</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', ()=>{
    if(window.Prism && Prism.plugins && Prism.plugins.autoloader){
      Prism.plugins.autoloader.languages_path = 'https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/';
    }
  });
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

:root{
  --bg:#0D0F13;
  --surface:#15181E;
  --surface-tint:#1D2129;
  --card:#15181E;
  --ink:#F5F4F0;
  --ink-soft:#9297A3;
  --border:rgba(255,255,255,0.08);
  --border-strong:rgba(255,255,255,0.18);

  --coral:#FF6A4D;      --coral-light:rgba(255,106,77,0.16); --coral-deep:#170804;
  --red:#FF4D5E;        --red-light:rgba(255,77,94,0.15);    --red-deep:#FF9CA8;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.brand,.btn,.nav-link,button{font-family:'Space Grotesk',sans-serif;letter-spacing:-0.01em}

a{color:inherit;text-decoration:none}
button{cursor:pointer;font-size:15px}
input,textarea,select{font-family:'Inter',sans-serif;font-size:15px;color:var(--ink)}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:10px}

.wrap{max-width:1080px;margin:0 auto;padding:0 24px}

/* ---------- icon helper ---------- */
.ic{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.ic svg{display:block}

/* ---------- nav ---------- */
.topnav{
  position:sticky;top:0;z-index:50;
  background:rgba(13,15,19,0.88);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);
}
.topnav-inner{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;max-width:1080px;margin:0 auto;gap:16px}
.brand{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:700;color:var(--ink);cursor:pointer;white-space:nowrap}
.brand .ic{color:var(--coral)}
.nav-links{display:flex;align-items:center;gap:2px;flex:1;justify-content:center}
.nav-link{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;font-weight:600;font-size:14px;color:var(--ink-soft)}
.nav-link:hover{background:var(--surface-tint);color:var(--ink)}
.nav-link.active{background:var(--coral);color:var(--coral-deep)}
.nav-search{display:flex;align-items:center;gap:6px;background:var(--surface-tint);border-radius:8px;padding:7px 12px;border:1px solid var(--border)}
.nav-search:focus-within{border-color:var(--coral)}
.nav-search input{background:none;border:none;outline:none;width:120px;color:var(--ink)}
.nav-search input::placeholder{color:var(--ink-soft)}
.nav-right{display:flex;align-items:center;gap:10px}
.role-pill{display:flex;align-items:center;gap:6px;background:var(--surface-tint);color:var(--ink);border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13px}
.role-pill.admin{background:var(--coral);color:var(--coral-deep);border-color:var(--coral)}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}

/* ---------- buttons ---------- */
.btn{border-radius:8px;padding:10px 18px;font-weight:600;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--surface-tint);border-color:var(--ink-soft)}
.btn:active{}
.btn-primary{background:var(--coral);border-color:var(--coral);color:var(--coral-deep)}
.btn-primary:hover{background:#ff7d61;border-color:#ff7d61}
.btn-ghost{border-color:transparent;background:none}
.btn-ghost:hover{background:var(--surface-tint)}
.btn-danger{border-color:var(--red);color:var(--red-deep);background:var(--red-light)}
.btn-sm{padding:6px 14px;font-size:13px;border-radius:7px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ---------- badges / pills ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 11px;border-radius:6px}
.badge-outline{background:none;border:1px solid var(--border-strong);color:var(--ink-soft)}

/* ---------- cards ---------- */
.card{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:18px}
.post-card{cursor:pointer;display:flex;flex-direction:column;height:100%;padding:0;overflow:hidden}
.post-card:hover{border-color:var(--border-strong);background:var(--surface-tint)}
.post-cover{width:100%;aspect-ratio:16/10;overflow:hidden;background:var(--surface-tint);flex-shrink:0}
.post-cover img{width:100%;height:100%;object-fit:cover;display:block}
.post-card-body{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1}
.post-title{font-family:'Space Grotesk';font-weight:700;font-size:17px;line-height:1.3;margin:0}
.post-excerpt{font-size:14px;color:var(--ink-soft);margin:0;flex:1}
.post-meta{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft)}
.post-meta .sep{opacity:.5}

/* ---------- hero ---------- */
.hero{background:var(--surface);border-radius:16px;position:relative;overflow:hidden;margin-bottom:28px;border:1px solid var(--border);min-height:300px;display:flex;align-items:flex-end;cursor:pointer}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg, rgba(13,15,19,0) 30%, rgba(13,15,19,0.92) 100%)}
.hero-content{position:relative;z-index:1;padding:32px;width:100%}

/* ---------- layout helpers ---------- */
.grid-2{display:grid;grid-template-columns:2fr 1fr;gap:24px}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.section-title{font-size:18px;font-weight:700;margin:0 0 14px;display:flex;align-items:center;gap:8px}

/* ---------- forms ---------- */
.field{margin-bottom:18px}
.field label{display:block;font-weight:600;font-size:13.5px;margin-bottom:6px;color:var(--ink-soft)}
.field input[type=text],.field input[type=email],.field input[type=password],.field textarea,.field select{
  width:100%;padding:12px 14px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);outline:none;color:var(--ink)
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--coral)}
.field textarea{resize:vertical;min-height:160px;line-height:1.7;font-family:'Inter'}
.editor-toolbar{display:flex;gap:8px;margin-bottom:8px}
.editor-hint{font-size:12.5px;color:var(--ink-soft);margin:6px 2px 0}
.editor-hint code{background:var(--surface-tint);border:1px solid var(--border);padding:1px 5px;border-radius:4px;font-family:'JetBrains Mono',monospace}

/* ---------- code blocks ---------- */
.code-block{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin:22px 0}
.code-block-head{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:var(--surface-tint);border-bottom:1px solid var(--border)}
.code-lang{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em}
.code-copy{display:flex;align-items:center;gap:5px;background:none;border:none;color:var(--ink-soft);font-size:12px;font-weight:600;padding:4px 9px;border-radius:6px}
.code-copy:hover{background:var(--surface);color:var(--ink)}
.code-block pre{margin:0;padding:16px 18px;overflow-x:auto}
.code-block pre,.code-block code{font-family:'JetBrains Mono',monospace;font-size:13.5px;line-height:1.65;background:none}
.inline-code{font-family:'JetBrains Mono',monospace;font-size:0.87em;background:var(--surface-tint);border:1px solid var(--border);padding:2px 6px;border-radius:5px;color:var(--coral)}

/* ---------- syntax highlighting (kept to the existing accent palette) ---------- */
.token.comment,.token.prolog,.token.doctype,.token.cdata{color:var(--ink-soft);font-style:italic}
.token.keyword,.token.tag,.token.boolean,.token.important,.token.atrule,.token.selector,.token.property{color:var(--coral)}
.token.string,.token.attr-value,.token.char,.token.builtin,.token.regex{color:var(--red-deep)}
.token.function,.token.class-name{color:var(--ink);font-weight:600}
.token.number,.token.deleted,.token.symbol{color:var(--red)}
.token.operator,.token.entity,.token.url,.token.variable,.token.attr-name{color:var(--ink-soft)}
.token.punctuation{color:var(--ink-soft);opacity:.75}

/* ---------- table-ish list ---------- */
.list-row{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--border)}
.list-row:last-child{border-bottom:none}

/* ---------- stat cards ---------- */
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:left}
.stat-num{font-family:'Space Grotesk';font-size:26px;font-weight:700;margin:2px 0}
.stat-label{font-size:12px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.05em}

/* ---------- bars ---------- */
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar-track{flex:1;height:8px;background:var(--surface-tint);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px}

/* ---------- toast ---------- */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border-strong);color:var(--ink);padding:12px 20px;border-radius:8px;font-weight:600;opacity:0;pointer-events:none;z-index:200;display:flex;align-items:center;gap:8px}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- misc ---------- */
.divider{border:none;border-top:1px solid var(--border);margin:24px 0}
.tag-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid transparent}
.tag-pill.active{border-color:var(--coral);background:var(--coral-light) !important;color:var(--ink) !important}
.empty-state{text-align:center;padding:60px 20px;color:var(--ink-soft)}
.tabs{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap}
.tab-btn{padding:9px 16px;border-radius:8px;font-weight:600;font-size:14px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink-soft)}
.tab-btn.active{background:var(--coral);color:var(--coral-deep);border-color:var(--coral)}
.fab{position:fixed;bottom:28px;right:28px;width:56px;height:56px;border-radius:14px;background:var(--coral);border:1px solid var(--coral);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(255,106,77,.28);z-index:40}
.fab:hover{background:#ff7d61}
.fab:active{}
footer{text-align:center;padding:40px 20px;color:var(--ink-soft);font-size:13.5px;border-top:1px solid var(--border);margin-top:20px}

.card{}
.tab-btn{}
.nav-link,.tag-pill,.role-pill{}

/* ---------- greeting loader (static, no motion) ---------- */
.greeting-loader{position:fixed;inset:0;z-index:1000;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--bg)}
.greeting-loader.hidden{display:none}
.greeting-mark{width:52px;height:52px;border-radius:14px;background:var(--coral);display:flex;align-items:center;justify-content:center;color:var(--coral-deep)}
.greeting-title{font-family:'Space Grotesk';font-size:22px;font-weight:700;color:var(--ink);text-align:center;letter-spacing:-0.01em}
.greeting-title .accent{color:var(--coral)}
.greeting-sub{color:var(--ink-soft);font-size:14px}

@media (max-width:760px){
  .grid-2{grid-template-columns:1fr}
  .nav-links{display:none}
  .nav-search input{width:80px}
}
</style>
</head>
<body>
<div id="loader" class="greeting-loader">
  <div class="greeting-mark" id="greetingMark"></div>
  <div class="greeting-title" id="greetingTitle">Good day</div>
  <div class="greeting-sub">Getting your feed ready…</div>
</div>
<div id="app"></div>
<div id="toast"></div>

<script>
/* =========================================================

function ic(name,size=18,color='currentColor',strokeWidth=1.8,rotate=0){
  const path = ICONS[name]||'';
  return `<span class="ic" style="width:${size}px;height:${size}px;color:${color};transform:rotate(${rotate}deg)">
    <svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="${strokeWidth}" stroke-linecap="round" stroke-linejoin="round">${path}</svg>
  </span>`;
}

function postById(id){ return DB.posts.find(p=>p.id===id); }
function catInfo(name){ return DB.categories.find(c=>c.name===name) || {name, color:'coral', icon:'tag'}; }
function readTime(text){ const words=(text||'').split(/\s+/).length; return Math.max(1, Math.round(words/180)) + ' min read'; }
function timeAgo(ts){
  const diff = Date.now()-ts, day=86400000;
  const d = Math.floor(diff/day);
  if(d<1) return 'today';
  if(d===1) return '1 day ago';
  if(d<30) return d+' days ago';
  return new Date(ts).toLocaleDateString('en-US',{month:'short', day:'numeric'});
}
function esc(s){ return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* =========================================================
   POST CONTENT — supports fenced code blocks and inline code
   ```language          → syntax-highlighted code block
   code                 → some prose
   `inline`             → inline code
   Blank lines separate paragraphs (and should surround a fenced block).
========================================================= */
function renderContent(raw){
  if(!raw || !raw.trim()) return '<p>Nothing written yet.</p>';
  const blocks = [];
  const withPlaceholders = raw.replace(/```([\w+-]*)\n?([\s\S]*?)```/g, (m, lang, code)=>{
    blocks.push({ lang: (lang||'plaintext').toLowerCase(), code: code.replace(/\n$/,'') });
    return `\u0000CODEBLOCK${blocks.length-1}\u0000`;
  });
  const parts = withPlaceholders.split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean);
  return parts.map(part=>{
    const m = part.match(/^\u0000CODEBLOCK(\d+)\u0000$/);
    if(m){
      const b = blocks[+m[1]];
      return `<div class="code-block">
        <div class="code-block-head">
          <span class="code-lang">${esc(b.lang)}</span>
          <button class="code-copy" onclick="copyCode(this)">${ic('copy',13)}Copy</button>
        </div>
        <pre><code class="language-${esc(b.lang)}">${esc(b.code)}</code></pre>
      </div>`;
    }
    const html = esc(part).replace(/`([^`\n]+)`/g,'<code class="inline-code">$1</code>').replace(/\n/g,'<br>');
    return `<p>${html}</p>`;
  }).join('');
}
function copyCode(btn){
  const codeEl = btn.closest('.code-block').querySelector('code');
  navigator.clipboard.writeText(codeEl.textContent)
    .then(()=>toast('Code copied','check'))
    .catch(()=>toast('Could not copy','x'));
}
function insertAtCursor(textareaId, before, after, placeholder){
  const ta = document.getElementById(textareaId);
  const start = ta.selectionStart, end = ta.selectionEnd;
  const selected = ta.value.substring(start, end) || placeholder;
  ta.value = ta.value.substring(0,start) + before + selected + after + ta.value.substring(end);
  ta.focus();
  const pos = start + before.length + selected.length + after.length;
  ta.selectionStart = ta.selectionEnd = pos;
}
function insertCodeBlock(){ insertAtCursor('fContent', '\n```js\n', '\n```\n', 'your code here'); }
function insertInlineCode(){ insertAtCursor('fContent', '`', '`', 'code'); }
function toast(msg, icon='check'){
  const t = document.getElementById('toast');
  t.innerHTML = ic(icon,16)+`<span>${esc(msg)}</span>`;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}

async function doSignUp(){
  const name = document.getElementById('suName').value.trim();
  const email = document.getElementById('suEmail').value.trim().toLowerCase();
  const password = document.getElementById('suPassword').value;
  const password2 = document.getElementById('suPassword2').value;

    id:'u'+Date.now(), name, email, password, bio:'', avatarColor:'coral', role:'user', status:'active',

  };
  DB.users.push(user);
  await saveUsers();
  DB.session.userId = user.id;

  toast(`Welcome to lightbook, ${name}`,'check');
  if(pendingRedirect){ const r=pendingRedirect; pendingRedirect=null; navigate(r.name, r.param); }
  else navigate('home');

async function toggleLike(id){
  if(!DB.session.userId){ pendingRedirect={name:'post',param:id}; toast('Sign in to like posts','lock'); navigate('signin'); return; }
  const post = postById(id);
  post._likedBy = post._likedBy || [];
  const uid = DB.session.userId;
  if(post._likedBy.includes(uid)){ post._likedBy = post._likedBy.filter(x=>x!==uid); post.likes--; }
  else { post._likedBy.push(uid); post.likes++; }
  await savePosts(); render();
}
async function addComment(id){
  if(!DB.session.userId){ pendingRedirect={name:'post',param:id}; toast('Sign in to comment','lock'); navigate('signin'); return; }
  const input = document.getElementById('commentInput');
  const text = input.value.trim();
  if(!text) return;
  const post = postById(id);
  post.comments.push({author:currentUser().name, text, createdAt:Date.now()});
  await savePosts(); render(); toast('Comment added','comment');
}
async function reportPost(id){
  if(!DB.session.userId){ pendingRedirect={name:'post',param:id}; toast('Sign in to report a post','lock'); navigate('signin'); return; }
  const post = postById(id);
  post.flagCount = (post.flagCount||0)+1;
  post.status = 'flagged';
  await savePosts();
  toast('Reported for review','flag');
  render();
}

async function savePost(id, status, btn){
  const title = document.getElementById('fTitle').value.trim();
  const category = document.getElementById('fCategory').value;
  const excerpt = document.getElementById('fExcerpt').value.trim() || 'No excerpt yet.';
  const content = document.getElementById('fContent').value.trim() || 'Nothing written yet.';
  const image = document.getElementById('fImage').value.trim() || `https://picsum.photos/seed/${Date.now()}/900/600`;
  if(!title){ toast('Give your post a title','x'); return; }
  const icon = catInfo(category).icon;

  const original = btn ? btn.innerHTML : null;
  if(btn){ btn.disabled = true; btn.textContent = status==='published'?'Publishing…':'Saving…'; }

  if(id){
    const post = postById(id);
    Object.assign(post, {title, category, excerpt, content, icon, image, status});
  } else {
    DB.posts.unshift({
      id:'p'+Date.now(), title, category, excerpt, content, icon, image, status,
      authorId: DB.session.userId, createdAt: Date.now(), views:0, likes:0, flagCount:0, comments:[]
    });
  }
  await savePosts();
  toast(status==='published' ? 'Post published' : 'Draft saved', 'check');
  navigate(status==='published' ? 'home' : 'dashboard');
}
async function deletePost(id){
  DB.posts = DB.posts.filter(p=>p.id!==id);
  await savePosts();
  toast('Post deleted','trash');
  navigate('dashboard');
}

  published.forEach(p=>{
    authorStats[p.authorId] = authorStats[p.authorId] || {views:0, likes:0};

    authorStats[p.authorId].likes += p.likes;

  return `

async function addCategory(){
  const name = document.getElementById('newCatName').value.trim();
  if(!name) return;
  if(DB.categories.some(c=>c.name.toLowerCase()===name.toLowerCase())){ toast('Category already exists','x'); return; }
  DB.categories.push({name, color:'coral', icon:'tag'});
  await saveCategories(); toast('Category added','check'); render();
}
async function deleteCategory(name){
  DB.categories = DB.categories.filter(c=>c.name!==name);
  await saveCategories(); toast('Category removed','trash'); render();
}
async function setFeatured(id){
  DB.featured = id;
  await saveFeatured(); toast('Featured post updated','star');
}

/* =========================================================
   MAIN RENDER
========================================================= */
function render(){
  const app = document.getElementById('app');
  let body = '';
  if(VIEW.name==='home') body = renderHome();
  else if(VIEW.name==='post') { const p=postById(VIEW.param); if(p) p.views++; body = renderPost(VIEW.param); savePosts(); }
  else if(VIEW.name==='editor') body = renderEditor(VIEW.param);
  else if(VIEW.name==='profile') body = renderProfile(VIEW.param);
  else if(VIEW.name==='search') body = renderSearch(VIEW.param);
  else if(VIEW.name==='dashboard') body = renderDashboard();
  else if(VIEW.name==='admin') body = renderAdmin();
  else if(VIEW.name==='signin') body = renderSignIn();
  else if(VIEW.name==='signup') body = renderSignUp();
  else body = renderHome();

  app.innerHTML = renderNav() + body + `<footer>${ic('pencil',14)} lightbook.info — a place to put things down</footer>`;
  if(window.Prism) Prism.highlightAllUnder(app);
}

/* =========================================================
   INIT
========================================================= */
function greetingText(){
  const h = new Date().getHours();
  if(h<5) return 'Still up?';
  if(h<12) return 'Good morning';
  if(h<17) return 'Good afternoon';
  if(h<21) return 'Good evening';
  return 'Good night';
}
(async function init(){
  document.getElementById('greetingMark').innerHTML = ic('pencil',24,'var(--coral-deep)');
  document.getElementById('greetingTitle').innerHTML = `${greetingText()} — welcome to <span class="accent">lightbook.info</span>`;

  await loadDB();
  render();
  document.getElementById('loader').remove();
})();
</script>
</body>
