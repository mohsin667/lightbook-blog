# Swap this in for nginx.conf on the server AFTER the first certificate has
# been issued (see the Certbot bootstrap step in the deploy notes). Trying to
# use this before a cert exists will fail — nginx won't start if
# ssl_certificate points at files that aren't there yet.

server {
    listen 80;
    server_name lightbook.blog www.lightbook.blog;

    # Renewals still use the HTTP-01 challenge over plain port 80.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name lightbook.blog www.lightbook.blog;

    ssl_certificate /etc/letsencrypt/live/lightbook.blog/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lightbook.blog/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
