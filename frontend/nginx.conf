server {
    listen 80;
    server_name lightbook.blog www.lightbook.blog;

    root /usr/share/nginx/html;
    index index.html;

    # Certbot's HTTP-01 challenge needs this reachable on plain port 80,
    # both now (first issuance) and later (renewals) — served from a volume
    # shared with the certbot container. See nginx.ssl.conf for the version
    # of this file to switch to once a certificate exists.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # React Router client-side routing: any path that isn't a real static
    # file falls back to index.html so the app's own router can handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to the backend container. "backend" resolves via
    # Docker Compose's internal DNS to the backend service.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
